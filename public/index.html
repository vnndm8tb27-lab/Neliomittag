<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.json"><title>Neliomittag</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px}h1{margin-top:0}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}button,select,input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #d1d5db}button{cursor:pointer;background:#111827;color:white}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.claim{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}</style>
<main><h1>🍽️ Neliomittag</h1><div class="card"><h2>Mittagessen</h2><div class="row"><input id="date" type="date"><select id="user"><option value="masur">Lurin Masur</option><option value="ducommun">Nelio Ducommun</option><option value="schwaegli">Camille Schwägli</option></select><button onclick="claim()">Eintragen</button></div></div><div class="card"><h2>Einträge</h2><div id="claims">Lade…</div></div></main>
<script>const date=document.querySelector('#date');date.value=new Date().toISOString().slice(0,10);async function load(){const claims=await fetch('/api/claims').then(r=>r.json());document.querySelector('#claims').innerHTML=claims.length?claims.sort((a,b)=>a.date.localeCompare(b.date)).map(c=>`<div class="claim"><span>${c.date}</span><strong>${c.userId}</strong><button onclick="removeClaim('${c.date}')">Löschen</button></div>`).join(''):'Noch keine Einträge.'}async function claim(){await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:date.value,userId:document.querySelector('#user').value})});load()}async function removeClaim(d){await fetch('/api/claim/'+encodeURIComponent(d),{method:'DELETE'});load()}load();</script>
