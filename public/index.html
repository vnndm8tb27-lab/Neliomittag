<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Neliomittag">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Neliomittag</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:24px 16px 40px}h1{margin:0 0 6px;font-size:30px}.sub{color:#6b7280;margin:0 0 18px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid #d1d5db}input,select{background:#fff;min-height:44px}button{cursor:pointer;background:#111827;color:white;border:0;min-height:44px}button.secondary{background:#e5e7eb;color:#111827}.claim{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.claim:last-child{border-bottom:0}.claim-name{font-weight:650}.claim-date{color:#6b7280;font-size:14px}.status{margin-top:12px;min-height:20px;color:#6b7280}.install{display:none;margin-top:12px;width:100%}@media(max-width:520px){main{padding:18px 12px}.row>*{width:100%}.claim{align-items:flex-start}.claim button{width:auto}}
  </style>
</head>
<body>
<main>
  <h1>🍽️ Neliomittag</h1>
  <p class="sub">Einfach Mittagessen eintragen und gemeinsam sehen.</p>

  <div class="card">
    <h2>Mittagessen</h2>
    <div class="row">
      <input id="date" type="date" aria-label="Datum">
      <select id="user" aria-label="Person">
        <option value="masur">Lurin Masur</option>
        <option value="ducommun">Nelio Ducommun</option>
        <option value="schwaegli">Camille Schwägli</option>
      </select>
      <button id="claimBtn">Eintragen</button>
    </div>
    <button id="installBtn" class="install secondary">📲 App zum Home-Bildschirm hinzufügen</button>
    <div id="status" class="status" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2>Einträge</h2>
    <div id="claims">Lade…</div>
  </div>
</main>
<script>
const date=document.querySelector('#date');
const user=document.querySelector('#user');
const claimsEl=document.querySelector('#claims');
const statusEl=document.querySelector('#status');
const installBtn=document.querySelector('#installBtn');
const names={masur:'Lurin Masur',ducommun:'Nelio Ducommun',schwaegli:'Camille Schwägli'};
date.value=new Date().toISOString().slice(0,10);

function setStatus(text){statusEl.textContent=text;}
async function api(url,options={}){const r=await fetch(url,options);if(!r.ok)throw new Error('Serverfehler');return r.json();}
async function load(){
  try{
    const claims=await api('/api/claims');
    claimsEl.innerHTML=claims.length?claims.sort((a,b)=>a.date.localeCompare(b.date)).map(c=>`<div class="claim"><div><div class="claim-name">${names[c.userId]||c.userId}</div><div class="claim-date">${new Date(c.date+'T12:00:00').toLocaleDateString('de-CH',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}</div></div><button class="secondary" onclick="removeClaim('${c.date}')">Löschen</button></div>`).join(''):'Noch keine Einträge.';
  }catch(e){claimsEl.textContent='Keine Verbindung zum Server.';setStatus('Bitte später nochmals versuchen.');}
}
async function claim(){
  if(!date.value)return;
  try{await api('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:date.value,userId:user.value})});setStatus('Gespeichert ✓');await load();}
  catch(e){setStatus('Speichern fehlgeschlagen.');}
}
async function removeClaim(d){
  try{await api('/api/claim/'+encodeURIComponent(d),{method:'DELETE'});setStatus('Gelöscht ✓');await load();}
  catch(e){setStatus('Löschen fehlgeschlagen.');}
}
document.querySelector('#claimBtn').addEventListener('click',claim);
load();

let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block';});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none';});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
